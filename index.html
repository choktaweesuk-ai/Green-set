<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Green Set</title>
<style>
:root{--green:#287b3d;--deep:#145b32;--mint:#e8f5df;--cream:#fffdf2;--line:#dcebd5;--text:#25442c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eef8e7,#fffdf3);font-family:Arial,"Tahoma",sans-serif;color:var(--text)}
.app{max-width:430px;min-height:100vh;margin:auto;background:var(--cream);box-shadow:0 0 30px #1b5e3218;position:relative;padding-bottom:78px}
.top{background:linear-gradient(135deg,#2d8743,#8fca6c);padding:14px 18px 18px;border-radius:0 0 28px 28px;color:#fff;display:flex;align-items:center;gap:12px}
.top img{width:58px;height:58px;object-fit:cover;border-radius:50%;background:#fff;border:3px solid #fff}.top h1{font-size:20px;margin:0}.top p{margin:3px 0 0;font-size:12px}
.page{padding:16px}.logo{display:block;width:190px;height:190px;object-fit:contain;margin:10px auto 5px;border-radius:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 16px #39704412}
h2{font-size:22px;margin:6px 0 14px}h3{font-size:17px;margin:0 0 10px}.muted{color:#6e8572;font-size:13px}
input,textarea,select{width:100%;padding:13px;border:1px solid #d2e4ce;border-radius:12px;background:#fff;margin:5px 0 11px;font-size:15px}
button{border:0;border-radius:13px;padding:12px 15px;background:var(--green);color:#fff;font-weight:bold;font-size:14px;cursor:pointer}
button.alt{background:#eef7e8;color:var(--deep);border:1px solid #cfe5c6}button.red{background:#df6b63}
.full{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:16px;background:var(--mint);text-align:center}.stat b{display:block;font-size:27px;color:var(--deep)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{padding:16px 8px;text-align:center;background:#f0f8e9;border:1px solid #d4eacb;border-radius:17px;color:var(--deep)}
.action span{display:block;font-size:27px;margin-bottom:5px}.item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:10px;margin:9px 0;background:#fff}
.item img{width:62px;height:62px;object-fit:cover;border-radius:12px}.item .info{flex:1}.item b{font-size:14px}.badge{display:inline-block;font-size:11px;padding:4px 8px;border-radius:20px;background:#d9f1d0;color:#277238;margin-top:5px}.badge.out{background:#ffe0dc;color:#b33d35}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 5px;z-index:5}.bottom button{background:transparent;color:#55705b;padding:6px 2px;font-size:11px}.bottom button.active{color:var(--green)}.bottom span{display:block;font-size:20px}
.hidden{display:none!important}.center{text-align:center}.back{background:transparent;color:var(--deep);padding:0;font-size:22px}.photo{width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin:5px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#205e34;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:10}
</style>
</head>

let logs=JSON.parse(localStorage.getItem('gs_logs')||'[]');
function save(){localStorage.setItem('gs_items',JSON.stringify(items));localStorage.setItem('gs_logs',JSON.stringify(logs))}
function login(){let n=loginName.value.trim();if(!n||loginPass.value!=='1234')return alert('กรุณากรอกชื่อและรหัสผ่าน 1234');user=n;localStorage.setItem('gs_user',n);start()}
function start(){loginPage.classList.add('hidden');main.classList.remove('hidden');nav.classList.remove('hidden');welcome.textContent=user;profileName.textContent=user;render()}
function logout(){localStorage.removeItem('gs_user');location.reload()}
function openScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');render()}
function render(){available.textContent=items.filter(x=>x.status==='ว่าง').length;borrowed.textContent=items.filter(x=>x.status!=='ว่าง').length;renderItems();renderHistory()}
function renderItems(){let q=(document.getElementById('search')?.value||'').toLowerCase();itemList.innerHTML=items.filter(x=>(x.name+x.id).toLowerCase().includes(q)).map(x=>`<div class="item"><img src="${logo}"><div class="info"><b>${x.name}</b><br><span class="muted">รหัส ${x.id}</span><br><span class="badge ${x.status==='ถูกยืม'?'out':''}">${x.status}</span></div><button onclick="showDetail('${x.id}')">${x.status==='ว่าง'?'ยืม':'คืน'}</button></div>`).join('')}
function renderHistory(){historyList.innerHTML=logs.length?logs.slice().reverse().map(x=>`<div class="card"><b>${x.action} ${x.item}</b><p class="muted">ผู้ทำรายการ: ${x.user}<br>วันเวลา: ${x.time}</p>${x.photo?`<img class="photo" src="${x.photo}">`:''}</div>`).join(''):'<div class="card center">ยังไม่มีประวัติการทำรายการ</div>'}
function showDetail(id){let x=items.find(a=>a.id===id);detail.innerHTML=`<button class="back" onclick="openScreen('items')">‹</button><h2>${x.status==='ว่าง'?'🔄 ยืมอุปกรณ์':'↩️ คืนอุปกรณ์'}</h2><div class="card"><div class="item"><img src="${logo}"><div><b>${x.name}</b><br><span class="badge ${x.status==='ถูกยืม'?'out':''}">${x.status}</span></div></div><label>ชื่อผู้ทำรายการ</label><input id="person" value="${user}"><label>วันที่และเวลา</label><input value="${new Date().toLocaleString('th-TH')}" disabled><label>ภาพยืนยัน</label><input id="photo" type="file" accept="image/*"><button class="full" onclick="submit('${x.id}')">ยืนยัน${x.status==='ว่าง'?'การยืม':'การคืน'}</button></div>`;openScreen('detail')}
function submit(id){let x=items.find(a=>a.id===id),action=x.status==='ว่าง'?'ยืม':'คืน',file=document.getElementById('photo').files[0],person=document.getElementById('person').value||user;let done=(photo='')=>{x.status=action==='ยืม'?'ถูกยืม':'ว่าง';logs.push({action:'บันทึกการ'+action,item:x.name,user:person,time:new Date().toLocaleString('th-TH'),photo});save();showToast('บันทึกข้อมูลเรียบร้อย ✓');openScreen('history')};if(file){let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(file)}else done()}
function showToast(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',2200)}
if(user)start();
